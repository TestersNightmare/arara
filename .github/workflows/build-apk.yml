name: Build & Release Arara APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "Decoded release.keystore from secret."
          else
            keytool -genkeypair -v -keystore release.keystore -alias arara -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "arara2026" -keypass "arara2026" -dname "CN=Arara, O=AraraBr, C=BR"
            echo "Generated default release.keystore so APK is installable."
          fi

      - name: Build Signed Release & Debug APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'arara2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'arara' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'arara2026' }}
        run: |
          gradle assembleDebug assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release*.apk arara.apk

      - name: Upload arara.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arara-apk
          path: arara.apk

      - name: Publish Latest GitHub Release (arara.apk)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: "Arara Android App (Latest APK)"
          body: |
            Direct APK Download Link:
            https://github.com/TestersNightmare/arara/releases/latest/download/arara.apk
          prerelease: false
          make_latest: true
          files: arara.apk
