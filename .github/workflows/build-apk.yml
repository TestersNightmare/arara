name: Publish Signed Arara APK Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check or Build Signed arara.apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'arara2026' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'arara' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'arara2026' }}
        run: |
          if [ -f "release/arara.apk" ]; then
            echo "Found locally signed release/arara.apk (signed via sign command). Using it directly."
            cp release/arara.apk arara.apk
          else
            echo "release/arara.apk not found; building and signing in CI..."
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            else
              keytool -genkeypair -v -keystore release.keystore -alias arara -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "arara2026" -keypass "arara2026" -dname "CN=Arara, O=AraraBr, C=BR"
            fi
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release*.apk arara.apk
          fi

      - name: Upload arara.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arara-apk
          path: arara.apk

      - name: Publish to GitHub Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}
          name: "Arara Android App (Latest Signed APK)"
          body: |
            Direct Signed APK Download Link:
            https://github.com/TestersNightmare/arara/releases/latest/download/arara.apk
          prerelease: false
          make_latest: true
          files: arara.apk
